[project]
name = "sc61box"
version = "0.6.1"
description = "SHARPのポケコン(PC-1251/1245/1261/1350)のエミュレータ(SC61860を命令単位で実行し、ROMを動かす)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "origuchi" }]
dependencies = [
    "pygame-ce>=2.5",
    "pillow>=10.0",
    "typer>=0.12",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
sc61box = "sc61box.app:cli"

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sc61box"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# レジスタ名(I、Lなど)をそのまま定数名にしている
"sc61box/sc61860.py" = ["E741"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyrefly]
search-path = [".", "tools", "tests"]
# 筐体の描画コード(型の注釈がない)は検査しない
project-excludes = ["tools/body_art.py", "tools/art_1245.py"]
